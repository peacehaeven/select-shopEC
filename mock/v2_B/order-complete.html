<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文完了 — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    .complete-box {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
    }
    .complete-icon { font-size: 48px; margin-bottom: 16px; }
    .complete-title { font-size: 24px; margin-bottom: 12px; }
    .complete-message { color: var(--muted); margin-bottom: 32px; line-height: 2; }
    .order-number { font-size: 13px; color: var(--muted); margin-bottom: 32px; }
    .status-info {
      background: #d1fae5;
      color: #065f46;
      border-radius: 4px;
      padding: 12px 20px;
      font-size: 13px;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ</div>
  <div class="nav-links">
    <a href="index.html">商品一覧</a>
  </div>
</nav>

<main>
  <div class="complete-box">
    <div class="complete-icon">✅</div>
    <h2 class="complete-title">ご注文ありがとうございます</h2>
    <p class="order-number">注文番号：#20250601-0042</p>
    <p class="complete-message">
      ご注文を受け付けました。<br>
      確認メールをお送りしましたのでご確認ください。
    </p>
    <div class="status-info">現在のステータス：注文受付済み</div>
    <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
      <a href="order-status.html" class="btn btn-primary" style="min-width: 180px;">注文状況を確認する</a>
      <a href="index.html" class="btn btn-secondary">買い物を続ける</a>
    </div>
  </div>
</main>

<footer>© 2025 なにわセレクトショップ</footer>

</body>
</html>
