<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文状況の確認 — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    .lookup-wrap {
      max-width: 440px;
      margin: 64px auto;
    }
    .lookup-description {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.8;
    }

    /* 照会結果（モック） */
    .result-card {
      background: var(--warm-white);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 24px;
      margin-top: 32px;
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .result-header .order-id {
      font-size: 16px;
      font-weight: 600;
    }
    .result-header .order-date {
      font-size: 12px;
      color: var(--muted);
    }
    .result-items {
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
    }
    .result-item:last-child { border-bottom: none; }
    .result-item-qty { color: var(--muted); font-size: 12px; margin-left: 6px; }
    .result-item-price { color: var(--vermilion); }
    .result-total {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      font-size: 14px;
    }
    .result-total strong { font-size: 16px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ</div>
  <div class="nav-links">
    <a href="index.html">商品一覧</a>
    <a href="cart.html">🛒 カート</a>
  </div>
</nav>

<main>
  <div class="lookup-wrap">

    <h2 class="section-title">注文状況の確認</h2>
    <p class="lookup-description">
      ご注文時の注文番号とメールアドレスを入力してください。
    </p>

    <div class="card">
      <div class="form-group">
        <label>注文番号</label>
        <input type="text" placeholder="#20250601-0042">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" placeholder="example@email.com">
      </div>
      <button class="btn btn-primary" style="display: block;" onclick="document.getElementById('result').style.display='block'">照会する</button>
    </div>

    <!-- 照会結果（モック表示） -->
    <div id="result" class="result-card" style="display: none;">
      <div class="result-header">
        <div>
          <div class="order-id">#20250601-0042</div>
          <div class="order-date">注文日：2025年6月1日</div>
        </div>
        <span class="status status-shipped">発送済み</span>
      </div>
      <div class="result-items">
        <div class="result-item">
          <span>なにわ黒毛和牛 すき焼きセット <span class="result-item-qty">× 1</span></span>
          <span class="result-item-price">¥8,640</span>
        </div>
        <div class="result-item">
          <span>泉州水茄子 浅漬けセット <span class="result-item-qty">× 2</span></span>
          <span class="result-item-price">¥4,320</span>
        </div>
      </div>
      <div class="result-total">
        <span style="color: var(--muted); font-size: 13px;">送料 ¥800 含む</span>
        <span>合計 <strong>¥13,760</strong></span>
      </div>
    </div>

  </div>
</main>

<footer>© 2025 なにわセレクトショップ</footer>

</body>
</html>
