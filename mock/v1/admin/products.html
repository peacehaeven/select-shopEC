<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理 — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
  <style>
    .admin-layout { display: grid; grid-template-columns: 180px 1fr; gap: 32px; align-items: start; }
    .admin-nav { background: var(--warm-white); border: 1px solid var(--border); border-radius: 4px; padding: 16px 0; }
    .admin-nav a { display: block; padding: 10px 20px; font-size: 13px; color: var(--ink); text-decoration: none; }
    .admin-nav a:hover { background: var(--cream); }
    .admin-nav a.active { background: var(--cream); color: var(--vermilion); font-weight: 500; border-left: 3px solid var(--vermilion); }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }

    /* モーダル */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
    }
    .modal {
      background: var(--warm-white);
      border-radius: 4px;
      padding: 32px;
      width: 480px;
      max-width: 90vw;
    }
    .modal-title { font-size: 18px; margin-bottom: 24px; }
    .modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ <span style="font-size: 12px; color: var(--muted);">管理</span></div>
  <div class="nav-links">
    <a href="../index.html" style="color: #ccc;">ショップへ戻る</a>
    <a href="login.html" style="color: #ccc;">ログアウト</a>
  </div>
</nav>

<main>
  <div class="admin-layout">

    <!-- サイドナビ -->
    <nav class="admin-nav">
      <a href="orders.html">注文管理</a>
      <a href="products.html" class="active">商品管理</a>
    </nav>

    <!-- 商品一覧 -->
    <div>
      <div class="page-header">
        <h2 class="section-title" style="margin-bottom: 0;">商品一覧</h2>
        <button class="btn btn-secondary" onclick="document.getElementById('modal').style.display='flex'">＋ 商品を追加</button>
      </div>

      <div class="card" style="padding: 0;">
        <table>
          <thead>
            <tr>
              <th>商品名</th>
              <th>価格</th>
              <th>在庫</th>
              <th>おすすめ</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>なにわ黒毛和牛 すき焼きセット</td>
              <td>¥8,640</td>
              <td>5</td>
              <td>✅</td>
              <td>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('modal').style.display='flex'">編集</button>
                &nbsp;
                <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #fee2e2; color: #991b1b; border: none;">削除</button>
              </td>
            </tr>
            <tr>
              <td>大阪湾 天然ハモ 白焼きセット</td>
              <td>¥5,400</td>
              <td>12</td>
              <td>✅</td>
              <td>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('modal').style.display='flex'">編集</button>
                &nbsp;
                <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #fee2e2; color: #991b1b; border: none;">削除</button>
              </td>
            </tr>
            <tr>
              <td>泉州水茄子 浅漬けセット</td>
              <td>¥2,160</td>
              <td>20</td>
              <td>✅</td>
              <td>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('modal').style.display='flex'">編集</button>
                &nbsp;
                <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #fee2e2; color: #991b1b; border: none;">削除</button>
              </td>
            </tr>
            <tr>
              <td>河内鴨 ロース 冷凍500g</td>
              <td>¥3,888</td>
              <td>8</td>
              <td>—</td>
              <td>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('modal').style.display='flex'">編集</button>
                &nbsp;
                <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #fee2e2; color: #991b1b; border: none;">削除</button>
              </td>
            </tr>
            <tr>
              <td>岸和田だんじり 地酒セット</td>
              <td>¥4,320</td>
              <td>0</td>
              <td>—</td>
              <td>
                <button class="btn btn-outline" style="padding: 4px 10px; font-size: 12px;" onclick="document.getElementById('modal').style.display='flex'">編集</button>
                &nbsp;
                <button class="btn" style="padding: 4px 10px; font-size: 12px; background: #fee2e2; color: #991b1b; border: none;">削除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<!-- 商品追加・編集モーダル -->
<div id="modal" class="modal-overlay" style="display: none;">
  <div class="modal">
    <h3 class="modal-title">商品を追加 / 編集</h3>
    <div class="form-group">
      <label>商品名</label>
      <input type="text" placeholder="例：なにわ黒豆 煮豆セット">
    </div>
    <div class="form-group">
      <label>価格（円）</label>
      <input type="number" placeholder="例：1296">
    </div>
    <div class="form-group">
      <label>在庫数</label>
      <input type="number" placeholder="例：10">
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox"> おすすめ商品に表示する
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="document.getElementById('modal').style.display='none'">キャンセル</button>
      <button class="btn btn-secondary" onclick="document.getElementById('modal').style.display='none'">保存する</button>
    </div>
  </div>
</div>

<footer>© 2025 なにわセレクトショップ 管理画面</footer>

</body>
</html>
