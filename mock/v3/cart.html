<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カート — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    .cart-layout { display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-control button { width: 28px; height: 28px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .qty-control span { min-width: 24px; text-align: center; }
    .remove-btn { color: var(--muted); background: none; border: none; cursor: pointer; font-size: 12px; }
    .remove-btn:hover { color: var(--ink); }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .summary-total { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }
    .card-no-pad { padding: 0; }
    .subsection-title { font-size: 16px; margin-bottom: 16px; }
    .input-short { width: 160px; }
    .btn-block { display: block; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ</div>
  <div class="nav-links">
    <a href="index.html">← 買い物を続ける</a>
  </div>
</nav>

<main>
  <h2 class="section-title">カート</h2>

  <div class="cart-layout">

    <!-- カート明細 -->
    <div>
      <div class="card card-no-pad">
        <table>
          <thead>
            <tr>
              <th>商品</th>
              <th>単価</th>
              <th>数量</th>
              <th>小計</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>なにわ黒毛和牛 すき焼きセット</td>
              <td>¥8,640</td>
              <td>
                <div class="qty-control">
                  <button>−</button>
                  <span>1</span>
                  <button>＋</button>
                </div>
              </td>
              <td>¥8,640</td>
              <td><button class="remove-btn">削除</button></td>
            </tr>
            <tr>
              <td>泉州水茄子 浅漬けセット</td>
              <td>¥2,160</td>
              <td>
                <div class="qty-control">
                  <button>−</button>
                  <span>2</span>
                  <button>＋</button>
                </div>
              </td>
              <td>¥4,320</td>
              <td><button class="remove-btn">削除</button></td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- 注文者情報 -->
      <h3 class="subsection-title">お届け先</h3>
      <div class="card">
        <div class="form-group">
          <label>お名前</label>
          <input type="text" placeholder="山田 太郎">
        </div>
        <div class="form-group">
          <label>メールアドレス</label>
          <input type="email" placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label>郵便番号</label>
          <input type="text" placeholder="530-0001" class="input-short">
        </div>
        <div class="form-group">
          <label>住所</label>
          <input type="text" placeholder="大阪府大阪市北区梅田1-1-1">
        </div>
        <div class="form-group">
          <label>電話番号</label>
          <input type="text" placeholder="090-0000-0000">
        </div>
      </div>

      <!-- 決済（フリ） -->
      <h3 class="subsection-title">お支払い</h3>
      <div class="card">
        <div class="form-group">
          <label>カード番号</label>
          <input type="text" placeholder="1234 5678 9012 3456">
        </div>
      </div>
    </div>

    <!-- 合計・注文ボタン -->
    <div class="card">
      <h3 class="subsection-title">注文内容</h3>
      <div class="summary-row"><span>小計</span><span>¥12,960</span></div>
      <div class="summary-row"><span>送料</span><span>¥800</span></div>
      <div class="summary-total"><span>合計</span><span>¥13,760</span></div>
      <br>
      <a href="order-complete.html" class="btn btn-primary btn-block">注文を確定する</a>
    </div>

  </div>
</main>

<footer>© 2025 なにわセレクトショップ</footer>

</body>
</html>
