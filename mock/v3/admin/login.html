<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ログイン — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../global.css">
  <style>
    .login-box { max-width: 360px; margin: 100px auto; }
    .login-title { font-size: 20px; margin-bottom: 24px; text-align: center; }
    .nav-admin-label { font-size: 12px; color: var(--muted); }
    .btn-block-mt { display: block; margin-top: 8px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ <span class="nav-admin-label">管理</span></div>
</nav>

<main>
  <div class="login-box">
    <h2 class="login-title">管理者ログイン</h2>
    <div class="card">
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" placeholder="admin@example.com">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" placeholder="••••••••">
      </div>
      <a href="orders.html" class="btn btn-primary btn-block-mt">ログイン</a>
    </div>
  </div>
</main>

</body>
</html>
