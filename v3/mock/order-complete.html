<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文完了 — なにわセレクトショップ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style>
    .complete-box { max-width: 480px; margin: 80px auto; text-align: center; }
    .complete-icon { font-size: 48px; margin-bottom: 16px; }
    .complete-title { font-size: 24px; margin-bottom: 20px; }
    .order-number { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
    .order-status { display: inline-block; margin-bottom: 32px; }
    .notice { background: #E8E8E8; color: #333; border-radius: 4px; padding: 16px 20px; font-size: 13px; margin-bottom: 32px; line-height: 1.8; text-align: left; }
    .btn-wide { min-width: 180px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">なにわ<span>セレクト</span>ショップ</div>
  <div class="nav-links">
    <a href="index.html">商品一覧</a>
  </div>
</nav>

<main>
  <div class="complete-box">
    <div class="complete-icon">✅</div>
    <h2 class="complete-title">ご注文ありがとうございます</h2>
    <p class="order-number">注文番号：#20250601-0042</p>
    <p class="order-status">
      <span class="status status-new">注文受付済み</span>
    </p>
    <div class="notice">
      発送が完了しましたら、ご登録のメールアドレス宛に<br>
      追跡番号付きの発送通知メールをお送りします。
    </div>
    <a href="index.html" class="btn btn-primary btn-wide">買い物を続ける</a>
  </div>
</main>

<footer>© 2025 なにわセレクトショップ</footer>

</body>
</html>
